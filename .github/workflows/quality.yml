name: FixFlow quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Validate Supabase configuration
        run: supabase config validate
      - name: Start local Supabase stack
        run: supabase start
      - name: Run database regression tests
        run: supabase test db
      - name: Typecheck
        run: npm run typecheck
      - name: Install Rollup Linux native binary
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.68.8
      - name: Build
        run: npm run build
